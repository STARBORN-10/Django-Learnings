{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock %}
    </title>
    {% tailwind_css %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="bg-slate-950 text-white min-h-screen">

<nav class="bg-slate-900 border-b border-slate-800 p-4 text-center text-xl font-semibold text-orange-400 shadow-md flex justify-center gap-6">
    <a href="{% url 'home' %}" class="hover:underline text-orange-400">Home</a>
    <a href="{% url 'all_chai' %}" class="hover:underline text-orange-400">All Chai</a>
</nav>

<div class="max-w-4xl mx-auto mt-8 p-4">
{% block content %}
{% endblock %}
</div>

</body>
</html>
